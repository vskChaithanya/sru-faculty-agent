<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRU Assistant - Admin Panel</title>
    <link rel="stylesheet" href="./sraap_demo_files/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .top-nav { background-color: #1a365d; color: white; padding: 15px 20px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; border-radius: 8px; }
        .table th { background-color: #1a365d; color: white; }
        .badge-up { background-color: #15803d; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; }
        .badge-down { background-color: #b91c1c; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn-delete:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="top-nav d-flex justify-content-between align-items-center">
        <h4 class="m-0">SRU AI Assistant - Admin Dashboard</h4>
        <a href="index.html" style="color: #ffc107; text-decoration: none; font-size: 14px; font-weight: bold;">Logout (Return to Login)</a>
    </div>

    <div class="container mt-5">
        <div class="card p-4">
            <h5 class="mb-4">User Feedback & Suggestions Logs</h5>
            
            <div class="table-responsive">
                <table class="table table-hover table-bordered">
                    <thead>
                        <tr>
                            <th>Date / Time</th>
                            <th>Faculty ID</th>
                            <th>Question Asked</th>
                            <th>Rating</th>
                            <th>User Suggestion</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="feedback-table-body">
                        <tr>
                            <td colspan="6" class="text-center text-muted">Loading feedback logs from secure database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Load data when page opens
        document.addEventListener("DOMContentLoaded", fetchFeedback);

        async function fetchFeedback() {
            const tableBody = document.getElementById("feedback-table-body");
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>`;
            
            try {
                const response = await fetch("https://sru-faculty-agent.onrender.com/api/admin/feedback");
                const result = await response.json();
                
                if (result.status === "success" && result.data.length > 0) {
                    tableBody.innerHTML = ""; 
                    
                    result.data.forEach(log => {
                        const dateObj = new Date(log.timestamp);
                        const formattedDate = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString();
                        const ratingBadge = log.feedback_type === "up" 
                            ? `<span class="badge-up">👍 Helpful</span>` 
                            : `<span class="badge-down">👎 Needs Work</span>`;
                        const suggestionText = log.suggestion ? log.suggestion : "<i class='text-muted'>No written suggestion</i>";

                        // Note: log._id is passed into the deleteFeedback function
                        const row = `
                            <tr>
                                <td style="font-size: 12px; white-space: nowrap;">${formattedDate}</td>
                                <td><b>${log.user_id}</b></td>
                                <td style="font-size: 14px;">${log.question}</td>
                                <td>${ratingBadge}</td>
                                <td style="font-size: 14px; color: #b91c1c;">${suggestionText}</td>
                                <td>
                                    <button class="btn-delete" onclick="deleteFeedback('${log._id}')">🗑️ Delete</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No feedback logs found.</td></tr>`;
                }
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger"><b>Error connecting to Server.</b></td></tr>`;
            }
        }

        async function deleteFeedback(logId) {
            // Ask for confirmation before deleting
            const confirmDelete = confirm("Are you sure you want to permanently delete this feedback?");
            if (!confirmDelete) return;

            try {
                const response = await fetch(`https://sru-faculty-agent.onrender.com/api/admin/feedback/${logId}`, {
                    method: "DELETE"
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    // Refresh the table immediately to show it's gone
                    fetchFeedback(); 
                } else {
                    alert("Error: Could not delete the record.");
                }
            } catch (error) {
                console.error("Delete error:", error);
                alert("Failed to connect to the server.");
            }
        }
    </script>
</body>
</html>
